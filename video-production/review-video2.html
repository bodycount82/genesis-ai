<main><header><img src="../tutorials/assets/brand/genesis.png" alt="Genesis"><div><h1>Find your way around Genesis</h1><p style="margin:5px 0">Video 2 · 30:35 · All five remaining lessons · 1080p · Your selected soundtrack</p></div></header>

</main><script>const video=document.querySelector('video');window.playbackEvidence={events:[],samples:[],startedAt:null,finishedAt:null};for(const name of ['playing','waiting','stalled','ended','error'])video.addEventListener(name,()=>{playbackEvidence.events.push({event:name,time:video.currentTime,at:Date.now(),error:video.error?.message||null});if(name==='ended')playbackEvidence.finishedAt=Date.now()});setInterval(()=>{if(!video.paused)playbackEvidence.samples.push({time:video.currentTime,ready:video.readyState,frames:video.getVideoPlaybackQuality().totalVideoFrames,dropped:video.getVideoPlaybackQuality().droppedVideoFrames})},5000);fetch('output/video-02/coverage.json').then(r=>r.json()).then(d=>{let done=new Set;for(const s of d.scenes)if(!done.has(s.step)){done.add(s.step);const b=document.createElement('button');b.textContent=d.chapters[s.step];b.onclick=()=>{video.currentTime=s.start;video.play()};document.querySelector('nav').appendChild(b)}});video.addEventListener('play',()=>playbackEvidence.startedAt??=Date.now());</script></html>
